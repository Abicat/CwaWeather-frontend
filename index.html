<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>小精靈的氣象天地</title>
    <link rel="icon" type="image/png" href="./icon-v2.png" />
    <link rel="apple-touch-icon" href="./icon-v2.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icon-v2.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        /* 夢幻森林配色 */
        --forest-dark-green: #2d5016;
        --forest-green: #4a7c3c;
        --forest-light-green: #6ba368;
        --forest-mint: #a8d5ba;
        --forest-cream: #f5f1e3;
        --forest-sky: #b8e6f0;
        --forest-lavender: #d4c5f9;
        --forest-peach: #ffd4a3;
        --forest-brown: #7d5a3f;
        --forest-gold: #f4e4c1;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        font-family: "Zen Maru Gothic", sans-serif;
        background: linear-gradient(
          180deg,
          #87ceeb 0%,
          #b8e6f0 30%,
          #a8d5ba 70%,
          #6ba368 100%
        );
        min-height: 100vh;
        color: var(--forest-dark-green);
        overflow-x: hidden;
        padding-bottom: 20px;
        position: relative;
      }

      /* 天空中的雲朵 */
      .cloud {
        position: fixed;
        color: white;
        font-size: 3rem;
        opacity: 0.6;
        animation: cloudFloat 30s linear infinite;
        z-index: 1;
      }

      .cloud1 {
        top: 8%;
        left: -10%;
        animation-duration: 35s;
      }
      .cloud2 {
        top: 15%;
        left: -15%;
        animation-duration: 40s;
        animation-delay: 5s;
      }
      .cloud3 {
        top: 25%;
        left: -20%;
        animation-duration: 45s;
        animation-delay: 10s;
      }

      @keyframes cloudFloat {
        0% {
          transform: translateX(0);
        }
        100% {
          transform: translateX(120vw);
        }
      }

      /* 飛舞的小精靈 */
      .fairy {
        position: fixed;
        font-size: 2rem;
        z-index: 2;
        animation: fairyFly 15s ease-in-out infinite;
        filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.8));
      }

      .fairy1 {
        top: 20%;
        left: 10%;
        animation-delay: 0s;
      }

      .fairy2 {
        top: 40%;
        right: 15%;
        animation-delay: 5s;
        animation-duration: 18s;
      }

      .fairy3 {
        top: 60%;
        left: 20%;
        animation-delay: 10s;
        animation-duration: 20s;
      }

      @keyframes fairyFly {
        0%,
        100% {
          transform: translate(0, 0) rotate(0deg);
        }
        25% {
          transform: translate(30px, -40px) rotate(10deg);
        }
        50% {
          transform: translate(-20px, -80px) rotate(-5deg);
        }
        75% {
          transform: translate(40px, -40px) rotate(8deg);
        }
      }

      /* 森林樹木背景 */
      .trees {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        height: 200px;
        display: flex;
        justify-content: space-around;
        align-items: flex-end;
        z-index: 0;
        opacity: 0.3;
      }

      .tree {
        font-size: 6rem;
        animation: treeSwing 4s ease-in-out infinite;
      }

      .tree:nth-child(1) {
        animation-delay: 0s;
      }
      .tree:nth-child(2) {
        animation-delay: 1s;
      }
      .tree:nth-child(3) {
        animation-delay: 2s;
      }
      .tree:nth-child(4) {
        animation-delay: 0.5s;
      }
      .tree:nth-child(5) {
        animation-delay: 1.5s;
      }

      @keyframes treeSwing {
        0%,
        100% {
          transform: rotate(0deg);
        }
        50% {
          transform: rotate(2deg);
        }
      }

      /* 飄落的花瓣/樹葉 */
      .petal {
        position: fixed;
        font-size: 1.5rem;
        opacity: 0.5;
        animation: petalFall 10s linear infinite;
        z-index: 1;
      }

      @keyframes petalFall {
        0% {
          transform: translateY(-10vh) rotate(0deg);
          opacity: 0.7;
        }
        100% {
          transform: translateY(110vh) rotate(360deg);
          opacity: 0;
        }
      }

      /* 頂部狀態列 */
      .status-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 20px;
        background: rgba(255, 255, 255, 0.5);
        backdrop-filter: blur(20px);
        border-bottom: 3px solid rgba(106, 163, 104, 0.4);
        position: sticky;
        top: 0;
        z-index: 100;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      }

      .location-pill {
        background: linear-gradient(135deg, #6ba368, #4a7c3c);
        color: white;
        padding: 10px 22px;
        border-radius: 25px;
        font-weight: 900;
        font-size: 1.1rem;
        box-shadow: 0 4px 15px rgba(74, 124, 60, 0.4);
        border: 2px solid rgba(255, 255, 255, 0.6);
      }

      .update-pill {
        font-size: 0.85rem;
        color: var(--forest-dark-green);
        background: rgba(255, 255, 255, 0.7);
        padding: 8px 16px;
        border-radius: 20px;
        font-weight: bold;
        border: 2px solid rgba(106, 163, 104, 0.3);
      }

      .container {
        padding: 30px 20px 20px 20px;
        max-width: 600px;
        margin: 0 auto;
        position: relative;
        z-index: 10;
      }

      /* === 核心：今日焦點卡片 === */
      .hero-card {
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.95),
          rgba(245, 241, 227, 0.9)
        );
        border-radius: 35px;
        padding: 35px 28px;
        text-align: center;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15),
          0 0 0 1px rgba(255, 255, 255, 0.6) inset;
        border: 3px solid rgba(168, 213, 186, 0.5);
        margin-bottom: 30px;
        position: relative;
        overflow: hidden;
      }

      /* 卡片內的夢幻光暈 */
      .hero-card::before {
        content: "";
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: radial-gradient(
          circle,
          rgba(212, 197, 249, 0.15) 0%,
          transparent 70%
        );
        animation: glow 8s ease-in-out infinite;
      }

      /* 卡片內飛舞的小星星 */
      .hero-card::after {
        content: "✨";
        position: absolute;
        top: 15%;
        right: 12%;
        font-size: 1.5rem;
        opacity: 0.6;
        animation: twinkle 3s ease-in-out infinite;
      }

      @keyframes glow {
        0%,
        100% {
          transform: translate(0, 0);
        }
        50% {
          transform: translate(10%, 10%);
        }
      }

      @keyframes twinkle {
        0%,
        100% {
          opacity: 0.3;
          transform: scale(1);
        }
        50% {
          opacity: 1;
          transform: scale(1.3);
        }
      }

      /* 夢幻對話氣泡 */
      .hero-period {
        background: linear-gradient(135deg, #d4c5f9, #b8e6f0);
        color: white;
        padding: 10px 28px;
        border-radius: 25px;
        font-weight: 900;
        border: 3px solid white;
        box-shadow: 0 6px 20px rgba(184, 230, 240, 0.5);
        z-index: 1;
        display: inline-block;
        margin-bottom: 18px;
        position: relative;
      }

      .hero-temp-container {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 20px;
        margin: 25px 0;
        position: relative;
        z-index: 1;
      }

      .hero-icon {
        font-size: 6rem;
        filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.2));
        animation: iconFloat 4s ease-in-out infinite;
        position: relative;
      }

      /* 主圖示的魔法光環 */
      .hero-icon::after {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        width: 120%;
        height: 120%;
        background: radial-gradient(
          circle,
          rgba(255, 255, 255, 0.3) 0%,
          transparent 70%
        );
        transform: translate(-50%, -50%);
        animation: pulse 2s ease-in-out infinite;
        z-index: -1;
      }

      @keyframes iconFloat {
        0%,
        100% {
          transform: translateY(0) rotate(-5deg);
        }
        50% {
          transform: translateY(-15px) rotate(5deg);
        }
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 0.5;
          transform: translate(-50%, -50%) scale(1);
        }
        50% {
          opacity: 0.8;
          transform: translate(-50%, -50%) scale(1.1);
        }
      }

      .hero-temp {
        font-size: 5rem;
        font-weight: 900;
        background: linear-gradient(135deg, #4a7c3c, #6ba368, #a8d5ba);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1;
        filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.15));
        position: relative;
      }

      .hero-desc {
        font-size: 1.6rem;
        color: var(--forest-brown);
        margin-bottom: 25px;
        font-weight: bold;
        position: relative;
        z-index: 1;
      }

      /* === 快速建議區 === */
      .advice-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
        margin-top: 25px;
        padding-top: 25px;
        border-top: 2px dashed rgba(106, 163, 104, 0.4);
        position: relative;
        z-index: 1;
      }

      .advice-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.85),
          rgba(168, 213, 186, 0.25)
        );
        padding: 18px;
        border-radius: 28px;
        border: 2px solid rgba(106, 163, 104, 0.4);
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
      }

      .advice-item::before {
        content: "";
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: radial-gradient(
          circle,
          rgba(255, 255, 255, 0.4) 0%,
          transparent 70%
        );
        opacity: 0;
        transition: opacity 0.3s ease;
      }

      .advice-item:hover::before {
        opacity: 1;
      }

      .advice-item:hover {
        transform: translateY(-8px) scale(1.02);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      }

      .advice-icon {
        font-size: 3rem;
        margin-bottom: 10px;
        filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.15));
        animation: gentleBounce 3s ease-in-out infinite;
      }

      @keyframes gentleBounce {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-5px);
        }
      }

      .advice-text {
        font-size: 1.35rem;
        font-weight: 900;
        color: var(--forest-dark-green);
        margin: 6px 0;
        line-height: 1.3;
      }

      .advice-subtext {
        font-size: 0.8rem;
        color: var(--forest-green);
        margin-top: 6px;
        font-weight: 600;
      }

      /* === 稍後預報：橫向滑動區 === */
      .section-title {
        font-size: 1.3rem;
        color: white;
        margin-bottom: 18px;
        margin-top: 15px;
        margin-left: 10px;
        font-weight: 900;
        text-shadow: 0 3px 10px rgba(0, 0, 0, 0.25);
        padding: 12px 25px;
        background: linear-gradient(135deg, #6ba368, #4a7c3c);
        display: inline-block;
        border-radius: 28px;
        box-shadow: 0 6px 20px rgba(74, 124, 60, 0.4);
        border: 2px solid rgba(255, 255, 255, 0.3);
      }

      .scroll-container {
        display: flex;
        overflow-x: auto;
        gap: 18px;
        padding: 12px 0 15px 0;
        scrollbar-width: none;
        -ms-overflow-style: none;
      }

      .scroll-container::-webkit-scrollbar {
        display: none;
      }

      .mini-card {
        min-width: 150px;
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.92),
          rgba(245, 241, 227, 0.88)
        );
        border-radius: 28px;
        padding: 18px 16px 22px 16px;
        text-align: center;
        border: 2px solid rgba(168, 213, 186, 0.5);
        flex-shrink: 0;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
      }

      .mini-card::before {
        content: "";
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: radial-gradient(
          circle,
          rgba(212, 197, 249, 0.2) 0%,
          transparent 70%
        );
        opacity: 0;
        transition: opacity 0.3s ease;
      }

      .mini-card:hover::before {
        opacity: 1;
      }

      .mini-card:hover {
        transform: translateY(-8px);
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
      }

      .mini-time {
        background: linear-gradient(135deg, #d4c5f9, #b8e6f0);
        color: white;
        padding: 6px 14px;
        border-radius: 18px;
        font-size: 0.85rem;
        display: inline-block;
        margin-bottom: 12px;
        font-weight: bold;
        box-shadow: 0 3px 10px rgba(184, 230, 240, 0.4);
      }

      .mini-icon {
        font-size: 3rem;
        margin: 10px 0;
        filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.15));
        animation: gentleBounce 3s ease-in-out infinite;
      }

      .mini-temp {
        font-size: 1.3rem;
        font-weight: 800;
        color: var(--forest-dark-green);
        margin: 10px 0;
      }

      .mini-rain {
        font-size: 0.85rem;
        color: var(--forest-green);
        background: rgba(168, 213, 186, 0.35);
        padding: 5px 12px;
        border-radius: 15px;
        display: inline-block;
        font-weight: 600;
      }

      /* Loading 畫面 */
      .loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(
          180deg,
          #87ceeb 0%,
          #b8e6f0 30%,
          #a8d5ba 70%,
          #6ba368 100%
        );
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 999;
      }

      .loading-clouds {
        position: relative;
        width: 200px;
        height: 200px;
        margin-bottom: 30px;
      }

      .loading-cloud {
        position: absolute;
        font-size: 3.5rem;
        animation: cloudOrbit 4s ease-in-out infinite;
        filter: drop-shadow(0 5px 15px rgba(255, 255, 255, 0.5));
      }

      .loading-cloud:nth-child(1) {
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        animation-delay: 0s;
      }

      .loading-cloud:nth-child(2) {
        top: 25%;
        right: 0;
        animation-delay: 0.5s;
      }

      .loading-cloud:nth-child(3) {
        bottom: 25%;
        right: 0;
        animation-delay: 1s;
      }

      .loading-cloud:nth-child(4) {
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        animation-delay: 1.5s;
      }

      .loading-cloud:nth-child(5) {
        bottom: 25%;
        left: 0;
        animation-delay: 2s;
      }

      .loading-cloud:nth-child(6) {
        top: 25%;
        left: 0;
        animation-delay: 2.5s;
      }

      @keyframes cloudOrbit {
        0%,
        100% {
          transform: scale(1) translateY(0);
          opacity: 0.6;
        }
        50% {
          transform: scale(1.2) translateY(-15px);
          opacity: 1;
        }
      }

      .loading-center {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 4rem;
        animation: centerPulse 2s ease-in-out infinite;
        filter: drop-shadow(0 5px 15px rgba(255, 255, 255, 0.8));
      }

      @keyframes centerPulse {
        0%,
        100% {
          transform: translate(-50%, -50%) scale(1);
        }
        50% {
          transform: translate(-50%, -50%) scale(1.15);
        }
      }

      .loading-text {
        color: white;
        font-weight: bold;
        font-size: 1.2rem;
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      }
    </style>
  </head>

  <body>
    <!-- 天空中的雲朵 -->
    <div class="cloud cloud1">☁️</div>
    <div class="cloud cloud2">☁️</div>
    <div class="cloud cloud3">☁️</div>

    <!-- 飛舞的小精靈 -->
    <div class="fairy fairy1">🧚</div>
    <div class="fairy fairy2">🧚‍♀️</div>
    <div class="fairy fairy3">🧚</div>

    <!-- 森林樹木背景 -->
    <div class="trees">
      <div class="tree">🌲</div>
      <div class="tree">🌳</div>
      <div class="tree">🌲</div>
      <div class="tree">🌳</div>
      <div class="tree">🌲</div>
    </div>

    <!-- 飄落的花瓣 -->
    <div class="petal" style="left: 10%; animation-delay: 0s">🌸</div>
    <div class="petal" style="left: 30%; animation-delay: 2s">🍃</div>
    <div class="petal" style="left: 50%; animation-delay: 4s">🌺</div>
    <div class="petal" style="left: 70%; animation-delay: 6s">🍂</div>
    <div class="petal" style="left: 90%; animation-delay: 8s">🌸</div>

    <div id="loading" class="loading-screen">
      <div class="loading-clouds">
        <div class="loading-cloud">☁️</div>
        <div class="loading-cloud">☁️</div>
        <div class="loading-cloud">☁️</div>
        <div class="loading-cloud">☁️</div>
        <div class="loading-cloud">☁️</div>
        <div class="loading-cloud">☁️</div>
        <div class="loading-center">🌤️</div>
      </div>
      <p class="loading-text">森林精靈正在觀測天氣...</p>
    </div>

    <div class="status-bar">
      <div class="location-pill">📍 新北市</div>
      <div id="updateTime" class="update-pill">更新中...</div>
    </div>

    <div class="container" id="mainContent" style="display: none">
      <div id="heroCard"></div>

      <h3 class="section-title">🌸 稍後預報</h3>
      <div class="scroll-container" id="futureForecasts"></div>
    </div>

    <script>
      const API_URL = "https://weather-wow.zeabur.app/api/weather/kaohsiung";

      // 夢幻森林風格的自然圖示
      function getWeatherIcon(weather) {
        if (!weather) return "🌤️";
        if (weather.includes("晴")) return "☀️";
        if (weather.includes("多雲")) return "⛅";
        if (weather.includes("陰")) return "☁️";
        if (weather.includes("雨")) return "🌧️";
        if (weather.includes("雷")) return "⛈️";
        return "🌤️";
      }

      function getAdvice(rainProb, maxTemp) {
        let rainIcon = "🌈";
        let rainText = "放心出門玩耍";
        if (parseInt(rainProb) > 30) {
          rainIcon = "🌂";
          rainText = "雨傘是最佳配件";
        }

        let clothIcon = "🌸";
        let clothText = "隨興穿搭";
        if (parseInt(maxTemp) >= 28) {
          clothIcon = "🦋";
          clothText = "清涼上陣吧";
        } else if (parseInt(maxTemp) <= 20) {
          clothIcon = "🍂";
          clothText = "多穿點不吃虧";
        }

        return { rainIcon, rainText, clothIcon, clothText };
      }

      function getTimePeriod(startTime) {
        const hour = new Date(startTime).getHours();
        if (hour >= 5 && hour < 11) return "早晨";
        if (hour >= 11 && hour < 14) return "中午";
        if (hour >= 14 && hour < 18) return "下午";
        if (hour >= 18 && hour < 23) return "晚上";
        return "深夜";
      }

      function renderWeather(data) {
        const forecasts = data.forecasts;
        const current = forecasts[0];
        const others = forecasts.slice(1);

        // 1. 渲染 Hero Card (主畫面)
        const advice = getAdvice(current.rain, current.maxTemp);
        const period = getTimePeriod(current.startTime);
        const avgTemp = Math.round(
          (parseInt(current.maxTemp) + parseInt(current.minTemp)) / 2
        );

        document.getElementById("heroCard").innerHTML = `
          <div class="hero-card">
            <div style="text-align: center; padding-top: 10px;">
              <div class="hero-period">${period}</div>
            </div>
            <div class="hero-temp-container">
              <div class="hero-icon">${getWeatherIcon(current.weather)}</div>
              <div class="hero-temp">${avgTemp}°</div>
            </div>
            <div class="hero-desc">${current.weather}</div>
            
            <div class="advice-grid">
              <div class="advice-item">
                <div class="advice-icon">${advice.rainIcon}</div>
                <div class="advice-text">${advice.rainText}</div>
                <div class="advice-subtext">降雨率 ${current.rain}</div>
              </div>
              <div class="advice-item">
                <div class="advice-icon">${advice.clothIcon}</div>
                <div class="advice-text">${advice.clothText}</div>
                <div class="advice-subtext">最高溫 ${current.maxTemp}°</div>
              </div>
            </div>
          </div>
        `;

        // 2. 渲染稍後預報 (包含明天判斷)
        const scrollContainer = document.getElementById("futureForecasts");
        scrollContainer.innerHTML = "";

        // 抓今天的日期數字 (例如 24)
        const todayDate = new Date().getDate();

        others.forEach((f) => {
          let p = getTimePeriod(f.startTime);

          // 判斷該預報的日期是否跟今天不同，不同就是明天
          const fDate = new Date(f.startTime);
          if (fDate.getDate() !== todayDate) {
            p = "明天" + p;
          }

          scrollContainer.innerHTML += `
            <div class="mini-card">
              <div class="mini-time">${p}</div>
              <div class="mini-icon">${getWeatherIcon(f.weather)}</div>
              <div class="mini-temp">${f.minTemp}° - ${f.maxTemp}°</div>
              <div class="mini-rain">💧${f.rain}</div>
            </div>
          `;
        });

        // 3. 右上角顯示今日日期
        const now = new Date();
        const month = now.getMonth() + 1;
        const date = now.getDate();
        const dayIndex = now.getDay();
        const days = ["週日", "週一", "週二", "週三", "週四", "週五", "週六"];

        document.getElementById(
          "updateTime"
        ).textContent = `${month}月${date}日 ${days[dayIndex]}`;
      }

      async function fetchWeather() {
        try {
          // 1. 定義「最低等待時間」：1500 毫秒 (1.5秒)
          const delayPromise = new Promise((resolve) =>
            setTimeout(resolve, 1500)
          );

          // 2. 定義「抓取資料」的工作
          const fetchPromise = fetch(API_URL).then((res) => res.json());

          // 3. Promise.all 會等待「兩個都完成」才會往下走
          const [_, json] = await Promise.all([delayPromise, fetchPromise]);

          if (json.success) {
            renderWeather(json.data);

            // 資料處理好後,隱藏 Loading,顯示主畫面
            document.getElementById("loading").style.display = "none";
            document.getElementById("mainContent").style.display = "block";
          } else {
            throw new Error("API Error");
          }
        } catch (e) {
          console.error(e);
          alert("天氣資料讀取失敗,森林精靈們還在睡覺!");
        }
      }

      document.addEventListener("DOMContentLoaded", fetchWeather);
    </script>
  </body>
</html>
